name: Backfill FEC results

# Backfills every Senate race and House district for 2026 -> 2016 into Supabase (see scripts/backfill.ts), 2026 first.
# Once everything is complete it switches to refresh mode: 2026 results older than 7 days are recomputed, oldest first.
# Each hourly run does up to 850 FEC calls / 55 minutes, then stops cleanly; finished work is skipped next time.
# To stop it: Actions tab -> "Backfill FEC results" -> "..." -> Disable workflow.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

# Never two at once; a running job is allowed to finish.
concurrency:
  group: backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo's lockfile is bun.lock (there is no package-lock.json), so install from it exactly.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run backfill
        shell: bash
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: npx --yes tsx@4.23.15 scripts/backfill.ts 2>&1 | tee backfill.log

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo '```'
            sed -n '/=== Backfill summary ===/,$p' backfill.log 2>/dev/null || echo "no summary (the script did not finish)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
